[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cso-insight"
version = "0.1.0"
description = "Data-driven analysis of combined sewer overflow discharges on public data"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "ElementeX Labs Inc." }]
keywords = ["cso", "wastewater", "rainfall", "environment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.6",
    "mkdocs>=1.6",
    "mypy>=1.11",
    "pyright>=1.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "scipy-stubs>=1.4",
]

docs = [
    "mkdocs>=1.6",
]

[project.scripts]
cso-insight = "cso_insight.cli:main"
cso-insight-linkage = "cso_insight.release_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cso_insight"]

[tool.hatch.build.targets.sdist]
exclude = [
    "data/raw",
    "data/processed",
    ".review",
    ".venv",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM117"]

[tool.ruff.lint.per-file-ignores]
"src/cso_insight/report.py" = ["E501"]
"tests/conftest.py" = ["E501", "RUF001"]
"tests/test_publication_fixes.py" = ["RUF001"]
"tests/test_coverage_gaps.py" = ["RUF001"]
"tests/test_cohort.py" = ["RUF001"]
"tests/test_download.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cso_insight"]
mypy_path = "src"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.coverage.run]
source = ["cso_insight"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: opt-in tests that download data or run the full pipeline",
    "network: tests that require network access",
]
